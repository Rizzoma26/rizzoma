# Одно окружение: /opt/rizzoma/prod (ветка main) или /opt/rizzoma/beta (ветка dev).
# Рядом лежат .env (секреты бота, STACK, BRANCH) и config.js. Файл копирует CI.
# IMAGE_TAG деплой передаёт через окружение (sha коммита); руками — тег ветки.
services:
  bot:
    image: ghcr.io/rizzoma26/rizzoma-bot:${IMAGE_TAG:-${BRANCH}}
    env_file: .env
    restart: unless-stopped

  web:
    image: ghcr.io/rizzoma26/rizzoma-web:${IMAGE_TAG:-${BRANCH}}
    volumes:
      - ./config.js:/srv/config.js:ro
    networks:
      default:
      edge:
        aliases: ["${STACK}-web"]
    depends_on:
      - bot
    restart: unless-stopped

networks:
  edge:
    external: true

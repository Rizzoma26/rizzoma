# Одно окружение: /opt/rizzoma/{prod,qa,dev}. Рядом .env (секреты бота, STACK, BRANCH)
# и public/config.js. Файл кладёт deploy/server/rizzoma-deploy.sh из нужного коммита.
# IMAGE_TAG — sha коммита (передаёт деплой); руками без него берётся тег ветки.
services:
  bot:
    image: ghcr.io/rizzoma26/rizzoma-bot:${IMAGE_TAG:-${BRANCH}}
    env_file: .env
    restart: unless-stopped

  web:
    image: ghcr.io/rizzoma26/rizzoma-web:${IMAGE_TAG:-${BRANCH}}
    volumes:
      - ./public:/conf:ro
    networks:
      default:
      edge:
        aliases: ["${STACK}-web"]
    depends_on:
      - bot
    restart: unless-stopped

networks:
  edge:
    external: true

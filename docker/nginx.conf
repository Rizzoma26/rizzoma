worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Do not log query strings, Telegram launch data or cookies.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index bootstrap.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8081;
    set $bot_upstream bot:8080;
    add_header Cache-Control 'no-store' always;
    add_header Referrer-Policy 'no-referrer' always;

    location = / { try_files /bootstrap.html =404; }
    location = /index.html { try_files /bootstrap.html =404; }
    location = /bootstrap.html { try_files $uri =404; }
    location = /bootstrap.js { try_files $uri =404; }

    location = /_session {
      internal;
      proxy_pass http://$api_upstream/api/v1/session;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
      proxy_set_header Cookie $http_cookie;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location = /api/v1/registrations/bot {
      return 404;
    }

    location ^~ /api/v1/ {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }

    location ^~ /api/ {
      auth_request /_session;
      proxy_pass http://$bot_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }

    location / {
      auth_request /_session;
      try_files $uri =404;
    }
  }
}

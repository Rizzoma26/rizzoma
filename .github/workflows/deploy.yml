name: deploy

# Деплой только того, что прошло тесты: ждём зелёный прогон «tests».
# main → прод, dev → бета. Выкатку делает self-hosted раннер на самом сервере:
# снаружи по SSH туда не попасть.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/rizzoma26
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    # Только пуши в этот репозиторий: PR из форка тоже порождает workflow_run,
    # и его код не должен ни попасть в реестр, ни доехать до раннера на сервере.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [bot, web, proxy]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/rizzoma-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/rizzoma-${{ matrix.image }}:${{ env.BRANCH }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    if: contains(fromJSON('["main","dev"]'), github.event.workflow_run.head_branch || github.ref_name)
    runs-on: [self-hosted, rizzoma]
    permissions:
      contents: read
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'prod' || 'beta' }}
    env:
      STACK: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'prod' || 'beta' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # Прокси общий: обновляется только с main, бета его не двигает.
      - name: Прокси
        if: env.STACK == 'prod'
        working-directory: /opt/rizzoma/proxy
        run: |
          install -m 644 "$GITHUB_WORKSPACE/deploy/proxy/docker-compose.yml" docker-compose.yml
          install -m 644 "$GITHUB_WORKSPACE/deploy/proxy/Caddyfile" Caddyfile
          export IMAGE_TAG=$SHA
          docker compose pull -q
          docker compose up -d
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

      - name: Выкатка ${{ env.STACK }}
        working-directory: /opt/rizzoma/${{ env.STACK }}
        run: |
          install -m 644 "$GITHUB_WORKSPACE/deploy/docker-compose.yml" docker-compose.yml
          export IMAGE_TAG=$SHA
          docker compose pull -q
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null

      - name: Проверка
        working-directory: /opt/rizzoma/${{ env.STACK }}
        run: |
          sleep 5
          docker compose ps

name: build

# Образы для окружений: main → прод, qa → qa, dev → dev.
# Собираем только то, что прошло тесты: ждём зелёный прогон «tests».
# Выкатывает сам сервер (deploy/server/rizzoma-deploy.sh): снаружи до него
# не достучаться, поэтому он раз в минуту забирает образы нужного коммита.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main, qa, dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/rizzoma26
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    # Только пуши в этот репозиторий: PR из форка тоже порождает workflow_run,
    # и его код не должен попасть в реестр — сервер выкатывает всё, что там лежит.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [bot, web, proxy]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/rizzoma-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/rizzoma-${{ matrix.image }}:${{ env.BRANCH }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
